name: Timeline
options:
  bundleIdPrefix: com.appler
  createIntermediateGroups: true
  xcodeVersion: "2700"
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Xcode 26 recommended settings.
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    DEVELOPMENT_TEAM: TN2RQ5P647
packages:
  LogShip:
    path: Packages/LogShip
targets:
  Timeline:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: Timeline
        excludes:
          - "*.entitlements"
          - "Fixtures/*.json"
      - path: Timeline/Fixtures/eiffel-tower-day.json
        buildPhase: resources
    dependencies:
      - sdk: libsqlite3.tbd
      - package: LogShip
    configFiles:
      Debug: Config/Version.xcconfig
      Release: Config/Version.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appler.Timeline
        PRODUCT_NAME: Timeline
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_CFBundleDisplayName: Timeline
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Timeline/Timeline.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Timeline/Timeline-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Timeline/Timeline-iOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        INFOPLIST_KEY_NSPrincipalClass[sdk=macosx*]: NSApplication
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # iPad multitasking requires all four, since the app is not full-screen only.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: Timeline/Info.plist
      properties:
        CFBundleDisplayName: Timeline
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        UILaunchScreen: {}
        NSDownloadsFolderUsageDescription: Timeline reads a Timeline.json export from Downloads when you open it.
        NSDocumentsFolderUsageDescription: Timeline opens a Google Maps Timeline JSON export that you choose.
        NSLocalNetworkUsageDescription: Timeline ships diagnostic logs to LogDock on your Mac when debugging.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Google Maps Timeline JSON
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: public.json
            UTTypeConformsTo: [public.text]
            UTTypeDescription: JSON Document
            UTTypeTagSpecification:
              public.filename-extension: [json]
              public.mime-type: [application/json]
  TimelineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TimelineTests
    dependencies:
      - target: Timeline_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appler.TimelineTests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Timeline.app/Timeline"
        BUNDLE_LOADER: "$(TEST_HOST)"
  TimelineMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TimelineTests
    dependencies:
      - target: Timeline_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appler.TimelineMacTests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Timeline.app/Contents/MacOS/Timeline"
        BUNDLE_LOADER: "$(TEST_HOST)"
        ENABLE_HARDENED_RUNTIME: NO
  TimelineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TimelineUITests
    dependencies:
      - target: Timeline_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appler.TimelineUITests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TEST_TARGET_NAME: Timeline_iOS
  TimelineMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: TimelineUITests
    dependencies:
      - target: Timeline_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appler.TimelineMacUITests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_TARGET_NAME: Timeline_macOS
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  Timeline_iOS:
    build:
      targets:
        Timeline_iOS: all
        TimelineTests: [test]
        TimelineUITests: [test]
    test:
      targets:
        - TimelineTests
        - TimelineUITests
    run:
      config: Debug
      # Disabled: MapKit briefly hits 0×0 Metal drawables during layout.
      enableGPUValidationMode: disabled
  Timeline_macOS:
    build:
      targets:
        Timeline_macOS: all
        TimelineMacTests: [test]
        TimelineMacUITests: [test]
    test:
      targets:
        - TimelineMacTests
        - TimelineMacUITests
    run:
      config: Debug
